<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prior Auth AI — Nurse Review Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    /* ── Shell ── */
    .shell {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      background: #0f2044;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Sidebar header */
    .sidebar-header {
      padding: 22px 18px 18px;
      border-bottom: 1px solid #1e3a73;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: #2563eb;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .sidebar-title {
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
    }

    .sidebar-subtitle {
      color: #94a3b8;
      font-size: 11px;
      margin-top: 1px;
    }

    /* Sidebar nav */
    .sidebar-nav {
      padding: 14px 12px;
      flex: 1;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #64748b;
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      text-align: left;
      transition: background 0.15s, color 0.15s;
      margin-bottom: 2px;
    }

    .nav-btn:hover {
      background: #1e3a73;
      color: #ffffff;
    }

    .nav-btn.active {
      background: #2563eb;
      color: #ffffff;
    }

    .nav-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
    }

    /* Sidebar footer */
    .sidebar-footer {
      padding: 16px 18px;
      border-top: 1px solid #1e3a73;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .health-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
    }

    .health-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #64748b;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .health-dot.online  { background: #4ade80; box-shadow: 0 0 6px rgba(74, 222, 128, 0.6); }
    .health-dot.offline { background: #dc2626; }

    .doctor-link {
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.15s;
    }

    .doctor-link:hover { color: #ffffff; }

    /* ── Main ── */
    .main {
      flex: 1;
      background: #ffffff;
      overflow-y: auto;
    }

    /* ── Views ── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Queue two-column layout ── */
    .queue-layout {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .left-panel {
      width: 38%;
      min-width: 300px;
      border-right: 1px solid #e2e8f0;
      overflow-y: auto;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
    }
    .right-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      background: #ffffff;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid #e2e8f0;
      background: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .count-badge {
      background: #2563eb;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
    }
    .refresh-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 4px;
    }
    .refresh-btn:hover { background: #f1f5f9; }

    .case-row {
      padding: 14px 16px;
      border-bottom: 1px solid #e2e8f0;
      cursor: pointer;
      background: white;
      transition: background 0.1s;
      border-left: 3px solid transparent;
    }
    .case-row:hover { background: #f8fafc; }
    .case-row.selected {
      background: #eff6ff;
      border-left-color: #2563eb;
    }
    .case-row-name {
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 3px;
    }
    .case-row-meta {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
    }
    .case-row-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .badge-urgent       { background: #fef3c7; color: #92400e; }
    .badge-not-analyzed { background: #f1f5f9; color: #64748b; }
    .badge-ready        { background: #dbeafe; color: #1d4ed8; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: #64748b;
      font-size: 14px;
      gap: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="shell">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">⚕</div>
        <div>
          <div class="sidebar-title">Prior Auth AI</div>
          <div class="sidebar-subtitle">Nurse Review Portal</div>
        </div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-label">Workflow</div>
      <button class="nav-btn active" id="nav-queue" onclick="showView('queue')">
        <span class="nav-icon">📋</span>
        <span>Case Queue</span>
      </button>
      <button class="nav-btn" id="nav-history" onclick="showView('history')">
        <span class="nav-icon">🕐</span>
        <span>Case History</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="health-row">
        <div class="health-dot" id="health-dot"></div>
        <span id="health-label">Checking...</span>
      </div>
      <a href="/doctor-portal" class="doctor-link">← Doctor Portal</a>
    </div>
  </aside>

  <main class="main">
    <div class="view active" id="view-queue">
      <div class="queue-layout">
        <div class="left-panel" id="left-panel">
          <div class="panel-header">
            <div class="panel-title">Pending Cases <span class="count-badge" id="pending-count">0</span></div>
            <button onclick="loadQueue()" class="refresh-btn">🔄</button>
          </div>
          <div id="pending-list"></div>
        </div>
        <div class="right-panel" id="right-panel">
          <div id="detail-empty" class="empty-state">
            <div style="font-size:48px">👈</div>
            <div>Select a case from the queue</div>
            <div style="font-size:12px; color:#94a3b8; margin-top:4px">Click a pending case to begin review</div>
          </div>
        </div>
      </div>
    </div>
    <div class="view" id="view-history">
      <p class="placeholder">History view</p>
    </div>
  </main>

</div>

<script>
  const API = 'http://localhost:8000';

  function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    document.getElementById('nav-' + name).classList.add('active');
  }

  async function checkHealth() {
    const dot   = document.getElementById('health-dot');
    const label = document.getElementById('health-label');
    try {
      const r = await fetch(API + '/health', { signal: AbortSignal.timeout(4000) });
      if (r.ok) {
        dot.className     = 'health-dot online';
        label.textContent = 'API Online';
      } else {
        throw new Error();
      }
    } catch {
      dot.className     = 'health-dot offline';
      label.textContent = 'API Offline';
    }
  }

  checkHealth();

  let allCases = [];
  let selectedCaseId = null;

  async function loadQueue() {
    try {
      const r = await fetch(API + '/prior-auth/queue');
      if (!r.ok) return;
      const data = await r.json();
      allCases = data.cases || [];
      const pending = allCases.filter(c => c.status === 'PENDING_NURSE_REVIEW');
      const history = allCases.filter(c => c.status !== 'PENDING_NURSE_REVIEW');
      document.getElementById('pending-count').textContent = pending.length;
      renderPendingList(pending);
      renderHistoryTable(history);
    } catch {}
  }

  function timeAgo(iso) {
    if (!iso) return '';
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
  }

  function renderPendingList(cases) {
    const el = document.getElementById('pending-list');
    if (!cases.length) {
      el.innerHTML = '<div class="empty-state"><div style="font-size:32px">✅</div><div>No pending cases</div></div>';
      return;
    }
    el.innerHTML = cases.map(c => {
      const name = (c.first_name && c.last_name)
        ? c.first_name + ' ' + c.last_name
        : 'Unknown Patient';
      const analyzed = c.ai_analysis_status === 'COMPLETE';
      const urgent = c.is_urgent;
      const selected = c.case_id === selectedCaseId ? ' selected' : '';
      const badges = [
        urgent ? '<span class="badge badge-urgent">Urgent</span>' : '',
        analyzed ? '<span class="badge badge-ready">Ready to Review</span>' : '<span class="badge badge-not-analyzed">Not Analyzed</span>',
      ].filter(Boolean).join('');
      return `<div class="case-row${selected}" data-id="${c.case_id}" onclick="loadCaseDetail('${c.case_id}')">
        <div class="case-row-name">${name}</div>
        <div class="case-row-meta">${c.cpt_code} · ${c.icd_code} · ${timeAgo(c.submitted_at)}</div>
        <div class="case-row-badges">${badges}</div>
      </div>`;
    }).join('');
  }

  function selectCase(caseId) {
    selectedCaseId = caseId;
    document.querySelectorAll('.case-row').forEach(r => {
      r.classList.toggle('selected', r.dataset.id === caseId);
    });
    const c = allCases.find(x => x.case_id === caseId);
    if (!c) return;
    const name = (c.first_name && c.last_name)
      ? c.first_name + ' ' + c.last_name
      : c.member_id;
    const rp = document.getElementById('right-panel');
    const analyzed = c.ai_analysis_status === 'COMPLETE';
    const reasoning = c.reasoning_output || {};
    const memberHistory = c.member_context ? `
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:20px">
        <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:12px">👤 Member Clinical History</div>
        ${(c.member_context.conditions && c.member_context.conditions.length > 0) ? `
          <div style="margin-bottom:12px">
            <div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Active Conditions</div>
            ${c.member_context.conditions.filter(x => x.is_active).slice(0, 5).map(x => `
              <div style="font-size:12px;color:#1e293b;margin-bottom:3px">• ${x.description || x.code}</div>
            `).join('')}
          </div>
        ` : ''}
        ${(c.member_context.medications && c.member_context.medications.length > 0) ? `
          <div style="margin-bottom:12px">
            <div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Recent Medications</div>
            ${c.member_context.medications.slice(0, 5).map(x => `
              <div style="font-size:12px;color:#1e293b;margin-bottom:3px">• ${x.description || x.code}</div>
            `).join('')}
          </div>
        ` : ''}
        ${(c.member_context.imaging && c.member_context.imaging.length > 0) ? `
          <div>
            <div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Prior Imaging</div>
            ${c.member_context.imaging.slice(0, 3).map(x => `
              <div style="font-size:12px;color:#1e293b;margin-bottom:3px">• ${x.modality_description || ''} ${x.bodysite_description || ''} (${x.study_date || ''})</div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    ` : '';
    const reasoningCard = (analyzed && reasoning.reasoning) ? `
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:20px">
        <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:12px">🧠 AI Clinical Reasoning</div>
        ${reasoning.policy_basis ? `
          <div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Policy Basis</div>
          <div style="font-size:12px;color:#475569;font-style:italic;margin-bottom:12px">${reasoning.policy_basis}</div>
        ` : ''}
        <div style="font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Reasoning</div>
        <div style="font-size:13px;color:#1e293b;line-height:1.6;margin-bottom:16px">${reasoning.reasoning}</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          ${(reasoning.criteria_met && reasoning.criteria_met.length > 0) ? `
            <div>
              <div style="font-size:11px;font-weight:700;color:#16a34a;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">✅ Criteria Met (${reasoning.criteria_met.length})</div>
              ${reasoning.criteria_met.map(item => `
                <div style="display:flex;gap:6px;margin-bottom:6px;font-size:12px;color:#1e293b;line-height:1.4">
                  <span style="color:#16a34a;flex-shrink:0">✓</span><span>${item}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
          ${(reasoning.criteria_not_met && reasoning.criteria_not_met.length > 0) ? `
            <div>
              <div style="font-size:11px;font-weight:700;color:#dc2626;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">❌ Criteria Not Met (${reasoning.criteria_not_met.length})</div>
              ${reasoning.criteria_not_met.map(item => `
                <div style="display:flex;gap:6px;margin-bottom:6px;font-size:12px;color:#1e293b;line-height:1.4">
                  <span style="color:#dc2626;flex-shrink:0">✗</span><span>${item}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
        ${(reasoning.missing_information && reasoning.missing_information.length > 0) ? `
          <div style="margin-top:12px;background:#fef9c3;border-radius:6px;padding:12px">
            <div style="font-size:11px;font-weight:700;color:#ca8a04;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">⚠️ Missing Information</div>
            ${reasoning.missing_information.map(item => `
              <div style="font-size:12px;color:#92400e;margin-bottom:4px">• ${item}</div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    ` : '';
    const policies = (analyzed && c.retrieved_policies && c.retrieved_policies.length > 0)
      ? `<div style="margin-bottom:20px">
          <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:10px">📄 Policy Documents Used</div>
          ${c.retrieved_policies.map((p, i) => `
            <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:14px;margin-bottom:10px">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <span style="font-size:12px;font-weight:600;color:#1e40af">${p.filename || 'Policy ' + (i + 1)}</span>
                <span style="background:#dbeafe;color:#1d4ed8;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px">${p.plan_name || ''}</span>
              </div>
              <div style="font-size:12px;color:#1e40af;line-height:1.6;white-space:pre-wrap">${p.content || ''}</div>
            </div>
          `).join('')}
        </div>`
      : '';
    rp.innerHTML = `
      <div style="max-width:720px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
          <div>
            <div style="font-size:18px;font-weight:700;color:#1e293b">${name}</div>
            <div style="font-size:12px;color:#64748b;margin-top:2px">Case ID: ${c.case_id}</div>
          </div>
          ${c.is_urgent ? '<span class="badge badge-urgent" style="font-size:12px;padding:4px 12px">URGENT</span>' : ''}
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
          <div style="background:#f8fafc;border-radius:8px;padding:14px">
            <div style="font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Clinical</div>
            <div style="font-size:13px;font-weight:600;color:#1e293b">CPT ${c.cpt_code}</div>
            <div style="font-size:12px;color:#64748b">ICD-10: ${c.icd_code}</div>
            <div style="font-size:12px;color:#64748b">Type: ${c.case_type || '—'}</div>
          </div>
          <div style="background:#f8fafc;border-radius:8px;padding:14px">
            <div style="font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Provider</div>
            <div style="font-size:13px;font-weight:600;color:#1e293b">NPI ${c.provider_npi || '—'}</div>
            <div style="font-size:12px;color:#64748b">Submitted: ${timeAgo(c.submitted_at)}</div>
          </div>
        </div>

        ${c.clinical_notes ? `<div style="background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:20px">
          <div style="font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Clinical Notes</div>
          <div style="font-size:13px;color:#1e293b;line-height:1.6">${c.clinical_notes}</div>
        </div>` : ''}

        ${memberHistory}

        ${!analyzed ? `<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:16px;margin-bottom:20px;display:flex;align-items:center;gap:12px">
          <div style="font-size:24px">🤖</div>
          <div style="flex:1">
            <div style="font-size:13px;font-weight:600;color:#92400e">AI Analysis Not Run</div>
            <div style="font-size:12px;color:#b45309;margin-top:2px">Run AI analysis to get a recommendation before reviewing</div>
          </div>
          <button onclick="runAnalysis('${c.case_id}')" style="background:#2563eb;color:white;border:none;border-radius:6px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer">Run Analysis</button>
        </div>` : `<div style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:16px;margin-bottom:20px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
            <div style="font-size:20px">🤖</div>
            <div style="font-size:13px;font-weight:700;color:#166534">AI Recommendation: ${reasoning.decision || c.ai_recommendation || '—'}</div>
            <span style="background:#dcfce7;color:#166534;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px">${Math.round((c.confidence_score || 0) * 100)}% confidence</span>
          </div>
          ${reasoning.summary ? `<div style="font-size:13px;color:#166534;line-height:1.5">${reasoning.summary}</div>` : ''}
        </div>`}

        ${reasoningCard}

        ${policies}

        ${analyzed ? `<div style="border:1px solid #e2e8f0;border-radius:8px;padding:20px;margin-bottom:20px">
          <div style="font-size:13px;font-weight:700;color:#1e293b;margin-bottom:16px">Nurse Decision</div>
          <div style="margin-bottom:16px">
            <label style="font-size:12px;font-weight:600;color:#64748b;display:block;margin-bottom:8px">Nurse ID *</label>
            <input type="text" id="nurse-id-input" placeholder="e.g. RN-78901"
              style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:6px;font-family:inherit;font-size:13px;outline:none" required />
          </div>
          <div style="display:flex;gap:10px;margin-bottom:16px">
            <button onclick="setDecision('APPROVE')" id="btn-approve" style="flex:1;padding:10px;border-radius:6px;border:2px solid #e2e8f0;background:white;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='#22c55e'" onmouseout="if(window._decision!=='APPROVE')this.style.borderColor='#e2e8f0'">✅ Approve</button>
            <button onclick="setDecision('DENY')" id="btn-deny" style="flex:1;padding:10px;border-radius:6px;border:2px solid #e2e8f0;background:white;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='#ef4444'" onmouseout="if(window._decision!=='DENY')this.style.borderColor='#e2e8f0'">❌ Deny</button>
            <button onclick="setDecision('REQUEST_MORE_INFO')" id="btn-request" style="flex:1;padding:10px;border-radius:6px;border:2px solid #e2e8f0;background:white;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s" onmouseover="this.style.borderColor='#f59e0b'" onmouseout="if(window._decision!=='REQUEST_MORE_INFO')this.style.borderColor='#e2e8f0'">📋 Request Info</button>
          </div>
          <textarea id="nurse-notes" placeholder="Override reason (required if decision differs from AI recommendation)..." style="width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:6px;font-family:inherit;font-size:13px;resize:vertical;min-height:80px;outline:none"></textarea>
          <button onclick="submitReview('${c.case_id}')" style="margin-top:12px;width:100%;background:#2563eb;color:white;border:none;border-radius:6px;padding:11px;font-size:14px;font-weight:600;cursor:pointer">Submit Decision</button>
          <div id="review-msg" style="margin-top:8px;font-size:12px;text-align:center"></div>
        </div>` : ''}
      </div>`;
  }

  function setDecision(d) {
    window._decision = d;
    ['btn-approve', 'btn-deny', 'btn-request'].forEach(id => {
      const btn = document.getElementById(id);
      if (btn) btn.style.borderColor = '#e2e8f0';
    });
    const map = { APPROVE: 'btn-approve', DENY: 'btn-deny', REQUEST_MORE_INFO: 'btn-request' };
    const colors = { APPROVE: '#22c55e', DENY: '#ef4444', REQUEST_MORE_INFO: '#f59e0b' };
    const btn = document.getElementById(map[d]);
    if (btn) btn.style.borderColor = colors[d];
  }

  async function runAnalysis(caseId) {
    const btn = document.querySelector('button[onclick="runAnalysis(\'' + caseId + '\')"]');
    if (btn) {
      btn.disabled = true;
      btn.textContent = '⏳ Running... ~30s';
    }

    const rp = document.getElementById('right-panel');
    const loadingBanner = document.createElement('div');
    loadingBanner.id = 'analysis-loading';
    loadingBanner.style.cssText =
      'background:#eff6ff;border:1px solid #bfdbfe;' +
      'border-radius:8px;padding:16px;margin-bottom:16px;' +
      'font-size:13px;color:#1e40af;display:flex;' +
      'align-items:center;gap:10px';
    loadingBanner.innerHTML =
      '<div style="font-size:20px">🔬</div>' +
      '<div><strong>Running AI Analysis...</strong><br>' +
      '<span style="font-size:12px">Fetching member data, retrieving policy documents, ' +
      'running GPT-4o clinical reasoning. This takes ~15-30 seconds.</span></div>';
    rp.prepend(loadingBanner);

    try {
      const r = await fetch(API + '/prior-auth/' + caseId + '/analyze', { method: 'POST' });
      if (r.ok) {
        await loadQueue();
        await loadCaseDetail(caseId);
      } else {
        const err = await r.json();
        loadingBanner.style.background = '#fee2e2';
        loadingBanner.style.borderColor = '#fca5a5';
        loadingBanner.style.color = '#991b1b';
        loadingBanner.innerHTML = '⚠️ Analysis failed: ' + (err.detail || 'Unknown error');
      }
    } catch (e) {
      loadingBanner.style.background = '#fee2e2';
      loadingBanner.innerHTML = '⚠️ Network error during analysis';
    }
  }

  async function submitReview(caseId) {
    const decision = window._decision;
    const nurseId = document.getElementById('nurse-id-input')?.value?.trim();
    const override = document.getElementById('nurse-notes')?.value?.trim();
    const msg = document.getElementById('review-msg');
    if (!decision) { if (msg) msg.textContent = 'Please select a decision first.'; return; }
    if (!nurseId) { if (msg) msg.textContent = 'Please enter your Nurse ID.'; return; }
    try {
      const r = await fetch(API + '/prior-auth/' + caseId + '/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          decision: decision,
          nurse_id: nurseId,
          override_reason: override || null,
          notes: override || null
        })
      });
      if (r.ok) {
        window._decision = null;

        const decisionDiv = document.getElementById('review-msg')?.closest('div[style*="border:1px solid"]');
        if (decisionDiv) {
          decisionDiv.innerHTML = `
            <div style="text-align:center;padding:24px">
              <div style="font-size:48px;margin-bottom:12px">✅</div>
              <div style="font-size:16px;font-weight:700;color:#16a34a;margin-bottom:6px">Decision Submitted</div>
              <div style="font-size:13px;color:#64748b">Your decision has been recorded and the case is now closed.</div>
            </div>
          `;
        }

        setTimeout(async () => {
          await loadQueue();
          selectedCaseId = null;
          document.getElementById('right-panel').innerHTML =
            '<div class="empty-state">' +
            '<div style="font-size:48px">✅</div>' +
            '<div style="font-weight:600">Decision recorded</div>' +
            '<div style="font-size:12px;color:#94a3b8;margin-top:4px">Select another case to continue reviewing</div>' +
            '</div>';
        }, 2000);
      } else {
        const e = await r.json();
        if (msg) msg.textContent = e.detail || 'Submission failed.';
      }
    } catch { if (msg) msg.textContent = 'Network error.'; }
  }

  function renderHistoryTable(cases) {
    const el = document.getElementById('view-history');
    if (!cases.length) {
      el.innerHTML = '<div class="empty-state" style="height:60vh"><div style="font-size:32px">📭</div><div>No completed cases</div></div>';
      return;
    }
    const statusColor = { APPROVED: '#16a34a', DENIED: '#dc2626', PENDING_NURSE_REVIEW: '#d97706', PENDING: '#d97706' };
    el.innerHTML = `<div style="padding:24px">
      <div style="font-size:16px;font-weight:700;color:#1e293b;margin-bottom:16px">Case History</div>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead>
          <tr style="border-bottom:2px solid #e2e8f0">
            <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px">Patient</th>
            <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px">CPT</th>
            <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px">Status</th>
            <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px">AI Rec.</th>
            <th style="text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px">Submitted</th>
          </tr>
        </thead>
        <tbody>
          ${cases.map(c => `<tr style="border-bottom:1px solid #f1f5f9">
            <td style="padding:10px 12px;font-weight:500;color:#1e293b">${(c.first_name && c.last_name) ? c.first_name + ' ' + c.last_name : c.member_id}</td>
            <td style="padding:10px 12px;color:#64748b">${c.cpt_code}</td>
            <td style="padding:10px 12px"><span style="color:${statusColor[c.status] || '#64748b'};font-weight:600">${c.status}</span></td>
            <td style="padding:10px 12px;color:#64748b">${c.ai_recommendation || '—'}</td>
            <td style="padding:10px 12px;color:#64748b">${timeAgo(c.submitted_at)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }

  async function loadCaseDetail(caseId) {
    try {
      const r = await fetch(API + '/prior-auth/' + caseId + '/status');
      const detail = await r.json();
      const idx = allCases.findIndex(c => c.case_id === caseId);
      if (idx >= 0) {
        allCases[idx] = { ...allCases[idx], ...detail };
      }
      selectCase(caseId);
    } catch (e) {
      console.error('Detail load failed:', e);
    }
  }

  loadQueue();
  setInterval(loadQueue, 30000);
</script>

</body>
</html>
